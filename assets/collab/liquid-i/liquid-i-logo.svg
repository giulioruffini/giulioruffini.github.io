<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img" aria-label="Liquid-I — the science of hyper-agency">
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F5FBF"/>
      <stop offset="0.55" stop-color="#0E3A8A"/>
      <stop offset="1" stop-color="#002878"/>
    </linearGradient>
    <linearGradient id="iglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a72"/>
      <stop offset="1" stop-color="#ff6657"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- The droplet: the boundary of the higher-order agent -->
  <g transform="translate(100 100)">
    <path d="M0 -78
             C 30 -42, 62 -8, 62 26
             A 62 62 0 1 1 -62 26
             C -62 -8, -30 -42, 0 -78 Z"
          fill="url(#drop)"/>
    <path d="M0 -78
             C 30 -42, 62 -8, 62 26
             A 62 62 0 1 1 -62 26
             C -62 -8, -30 -42, 0 -78 Z"
          fill="url(#halo)"/>

    <!-- The agent substrate: smaller agents coalescing upward -->
    <!-- Three converging angles: BCOM blue, Solé orange, Levin green -->
    <circle cx="-30" cy="40" r="6"  fill="#7fa8e6" opacity="0.9"/>
    <circle cx="-8"  cy="50" r="5"  fill="#D88512" opacity="0.92"/>
    <circle cx="20"  cy="44" r="6"  fill="#3FB155" opacity="0.9"/>
    <circle cx="34"  cy="22" r="4.5" fill="#7fa8e6" opacity="0.85"/>
    <circle cx="-34" cy="16" r="4.5" fill="#3FB155" opacity="0.85"/>
    <circle cx="-16" cy="24" r="3.5" fill="#D88512" opacity="0.8"/>
    <circle cx="12"  cy="18" r="3.5" fill="#7fa8e6" opacity="0.8"/>

    <!-- The emergent higher-order agent: the "I" -->
    <g fill="url(#iglow)">
      <rect x="-9" y="-46" width="18" height="18" rx="3"/>
      <rect x="-6.5" y="-24" width="13" height="44" rx="3.5"/>
      <rect x="-15" y="22" width="30" height="9" rx="4.5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="196" y="98" font-size="52" font-weight="700" fill="#0E3A8A" letter-spacing="-1">Liquid<tspan fill="#ff6657">-I</tspan></text>
    <text x="198" y="128" font-size="16.5" font-weight="500" fill="#5b5b5b" letter-spacing="0.4">the science of hyper-agency</text>
  </g>
</svg>
