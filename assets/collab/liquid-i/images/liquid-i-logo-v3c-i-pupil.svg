<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img" aria-label="Liquid-I — horizontal eye with I pupil">
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F5FBF"/>
      <stop offset="0.55" stop-color="#0E3A8A"/>
      <stop offset="1" stop-color="#002878"/>
    </linearGradient>
    <linearGradient id="iglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a82"/>
      <stop offset="1" stop-color="#ff6045"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#ffd0bf"/>
      <stop offset="0.65" stop-color="#ff8266"/>
      <stop offset="1"    stop-color="#a8331f"/>
    </radialGradient>
  </defs>

  <g transform="translate(100 100)">
    <path d="M0 -78 C 30 -42, 62 -8, 62 26 A 62 62 0 1 1 -62 26 C -62 -8, -30 -42, 0 -78 Z" fill="url(#drop)"/>
    <path d="M0 -78 C 30 -42, 62 -8, 62 26 A 62 62 0 1 1 -62 26 C -62 -8, -30 -42, 0 -78 Z" fill="url(#halo)"/>

    <!-- Horizontal almond eye -->
    <path d="M -34 -14
             C -30 -34, -14 -38,  0 -38
             C  14 -38,  30 -34,  34 -14
             C  30   8,  14  14,  0  14
             C -14  14, -30   8, -34 -14 Z"
          fill="url(#iglow)"/>

    <!-- Iris -->
    <circle cx="0" cy="-14" r="15"   fill="#0E3A8A"/>
    <circle cx="0" cy="-14" r="11.5" fill="url(#iris)"/>

    <!-- Pupil IS the letter I (the wordplay made literal) -->
    <g fill="#001a4f">
      <rect x="-4"   y="-23"  width="8"   height="2.4" rx="0.8"/>
      <rect x="-1.6" y="-20.6" width="3.2" height="13"  rx="0.6"/>
      <rect x="-4"   y="-7.6"  width="8"   height="2.4" rx="0.8"/>
    </g>
    <!-- Catchlight placed off-axis to keep the I crisp -->
    <circle cx="-6" cy="-19" r="1.5" fill="#ffffff" opacity="0.85"/>

    <!-- Three converging agents -->
    <circle cx="-26" cy="46" r="6"   fill="#7fa8e6" opacity="0.95"/>
    <circle cx="0"   cy="56" r="5.5" fill="#D88512" opacity="0.95"/>
    <circle cx="26"  cy="46" r="6"   fill="#3FB155" opacity="0.95"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="196" y="98" font-size="52" font-weight="700" fill="#0E3A8A" letter-spacing="-1">Liquid<tspan fill="#ff6045">-I</tspan></text>
    <text x="198" y="128" font-size="16.5" font-weight="500" fill="#5b5b5b" letter-spacing="0.4">the science of hyper-agency</text>
  </g>
</svg>
