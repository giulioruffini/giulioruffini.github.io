<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img" aria-label="Liquid-I — vertical eye">
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F5FBF"/>
      <stop offset="0.55" stop-color="#0E3A8A"/>
      <stop offset="1" stop-color="#002878"/>
    </linearGradient>
    <linearGradient id="iglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a82"/>
      <stop offset="1" stop-color="#ff6045"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#ffb39e"/>
      <stop offset="0.65" stop-color="#ff6657"/>
      <stop offset="1"    stop-color="#a8331f"/>
    </radialGradient>
  </defs>

  <g transform="translate(100 100)">
    <path d="M0 -78 C 30 -42, 62 -8, 62 26 A 62 62 0 1 1 -62 26 C -62 -8, -30 -42, 0 -78 Z" fill="url(#drop)"/>
    <path d="M0 -78 C 30 -42, 62 -8, 62 26 A 62 62 0 1 1 -62 26 C -62 -8, -30 -42, 0 -78 Z" fill="url(#halo)"/>

    <!-- Vertical eye-I (positioned in upper drop, clear of agents) -->
    <rect x="-15" y="-54" width="30" height="5" rx="2.5" fill="url(#iglow)"/>
    <path d="M 0 -46
             Q 14 -30, 14 -12
             Q 14 6, 0 20
             Q -14 6, -14 -12
             Q -14 -30, 0 -46 Z"
          fill="url(#iglow)"/>
    <circle cx="0" cy="-12" r="11"  fill="#0E3A8A"/>
    <circle cx="0" cy="-12" r="8.5" fill="url(#iris)"/>
    <circle cx="0" cy="-12" r="3.5" fill="#001a4f"/>
    <circle cx="-2.2" cy="-14" r="1.6" fill="#ffffff" opacity="0.92"/>
    <rect x="-15" y="22" width="30" height="5" rx="2.5" fill="url(#iglow)"/>

    <!-- Three converging agents: BCOM blue · Solé orange · Levin green -->
    <circle cx="-24" cy="56" r="6"   fill="#7fa8e6" opacity="0.95"/>
    <circle cx="0"   cy="64" r="5.5" fill="#D88512" opacity="0.95"/>
    <circle cx="24"  cy="56" r="6"   fill="#3FB155" opacity="0.95"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="196" y="98" font-size="52" font-weight="700" fill="#0E3A8A" letter-spacing="-1">Liquid<tspan fill="#ff6045">-I</tspan></text>
    <text x="198" y="128" font-size="16.5" font-weight="500" fill="#5b5b5b" letter-spacing="0.4">the science of hyper-agency</text>
  </g>
</svg>
