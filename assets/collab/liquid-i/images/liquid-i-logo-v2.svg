<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img" aria-label="Liquid-I — the science of hyper-agency">
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F5FBF"/>
      <stop offset="0.55" stop-color="#0E3A8A"/>
      <stop offset="1" stop-color="#002878"/>
    </linearGradient>
    <linearGradient id="iglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a82"/>
      <stop offset="1" stop-color="#ff6045"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffb39e"/>
      <stop offset="0.65" stop-color="#ff6657"/>
      <stop offset="1"    stop-color="#a8331f"/>
    </radialGradient>
  </defs>

  <!-- The droplet: the boundary of the higher-order agent -->
  <g transform="translate(100 100)">
    <path d="M0 -78
             C 30 -42, 62 -8, 62 26
             A 62 62 0 1 1 -62 26
             C -62 -8, -30 -42, 0 -78 Z"
          fill="url(#drop)"/>
    <path d="M0 -78
             C 30 -42, 62 -8, 62 26
             A 62 62 0 1 1 -62 26
             C -62 -8, -30 -42, 0 -78 Z"
          fill="url(#halo)"/>

    <!-- Agent substrate: smaller agents coalescing upward
         BCOM blue · Solé orange · Levin green -->
    <circle cx="-32" cy="44" r="5.5" fill="#7fa8e6" opacity="0.92"/>
    <circle cx="-10" cy="52" r="4.5" fill="#D88512" opacity="0.92"/>
    <circle cx="20"  cy="48" r="5.5" fill="#3FB155" opacity="0.92"/>
    <circle cx="36"  cy="26" r="4"   fill="#7fa8e6" opacity="0.85"/>
    <circle cx="-36" cy="20" r="4"   fill="#3FB155" opacity="0.85"/>
    <circle cx="-18" cy="34" r="3"   fill="#D88512" opacity="0.8"/>
    <circle cx="10"  cy="30" r="3"   fill="#7fa8e6" opacity="0.8"/>

    <!-- The emergent higher-order agent: "I" as Eye -->
    <g>
      <!-- Upper I-serif / brow -->
      <rect x="-17" y="-54" width="34" height="6.5" rx="3.2" fill="url(#iglow)"/>

      <!-- Eye-stem: vertical almond (the I body, the eye opening) -->
      <path d="M 0 -46
               C  9 -38,  19 -20,  19 0
               C  19  20,  9  38,  0  46
               C -9  38, -19  20, -19 0
               C -19 -20, -9 -38,  0 -46 Z"
            fill="url(#iglow)"/>

      <!-- Iris ring (deep BCOM blue cut into the eye) -->
      <circle cx="0" cy="0" r="13" fill="#0E3A8A"/>
      <!-- Iris body -->
      <circle cx="0" cy="0" r="10.5" fill="url(#iris)"/>
      <!-- Pupil -->
      <circle cx="0" cy="0" r="4.2" fill="#001a4f"/>
      <!-- Catchlight: the spark of awareness -->
      <circle cx="-2.6" cy="-2.6" r="1.9" fill="#ffffff" opacity="0.92"/>
      <circle cx="3"    cy="3"    r="0.9" fill="#ffffff" opacity="0.7"/>

      <!-- Lower I-serif / base -->
      <rect x="-17" y="47.5" width="34" height="6.5" rx="3.2" fill="url(#iglow)"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="196" y="98" font-size="52" font-weight="700" fill="#0E3A8A" letter-spacing="-1">Liquid<tspan fill="#ff6045">-I</tspan></text>
    <text x="198" y="128" font-size="16.5" font-weight="500" fill="#5b5b5b" letter-spacing="0.4">the science of hyper-agency</text>
  </g>
</svg>
