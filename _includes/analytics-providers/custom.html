<!-- GoatCounter visit counter, shared with www.giulioruffini.com (dashboard: giulioruffini.goatcounter.com).

     local builds send nothing. The standalone pages in assets/blogs and assets/collab/mathematics
     carry the same two script tags. -->

<script data-goatcounter="https://giulioruffini.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
